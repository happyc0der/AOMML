name: CI

on:
  push:
    branches: [main, implement-ssgd]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  notebook:
    name: notebook executes end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # MNIST and the California housing cache are committed, so this needs no network.
      - name: Execute Project.ipynb
        run: uv run jupyter nbconvert --execute --to notebook --stdout Project.ipynb > /dev/null
