[project]
name = "aomml"
version = "0.1.0"
description = "Stochastic subgradient descent and SSGD with momentum, applied to LASSO and a ReLU network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aomml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
# Project.ipynb is generated by tools/build_notebook.py; lint the generator, not the output.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E731",  # assigning a lambda: the loss-function idiom used throughout is clearer inline
    "B023",  # loop-variable capture in closures: intentional in the experiment sweeps
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/build_notebook.py" = ["E501"]  # notebook prose is long-form markdown
